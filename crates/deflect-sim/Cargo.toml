[package]
name = "deflect-sim"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Deterministic attack simulation harness over the deflect-rs primitives (DST + WASM visualizer core)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deflect-kit = { path = "../deflect-kit", features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.108"

[lints.clippy]
all = "warn"
pedantic = "warn"
