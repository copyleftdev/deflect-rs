[workspace]
resolver = "2"
members = [
    "crates/deflect-core",
    "crates/deflect-ratelimit",
    "crates/deflect-detect",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/copyleftdev/deflect-rs"
authors = ["copyleftdev"]

[workspace.dependencies]
deflect-core = { path = "crates/deflect-core" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
