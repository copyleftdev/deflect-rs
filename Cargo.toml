[workspace]
resolver = "2"
members = [
    "crates/deflect-core",
    "crates/deflect-ratelimit",
    "crates/deflect-detect",
    "crates/deflect-syncookie",
    "crates/deflect-signature",
    "crates/deflect-reflect",
    "crates/deflect-fingerprint",
    "crates/deflect-enforce",
    "crates/deflect-telemetry",
    "crates/deflect-bgp",
    "crates/deflect-packet",
    "crates/deflect-kit",
    "crates/deflect-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/copyleftdev/deflect-rs"
authors = ["copyleftdev"]
keywords = ["ddos", "mitigation", "network", "security"]
categories = ["network-programming"]

[workspace.dependencies]
deflect-core = { path = "crates/deflect-core", version = "0.1.0", default-features = false }
deflect-packet = { path = "crates/deflect-packet", version = "0.1.0", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
